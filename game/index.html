<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teluk Senja — Open World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14121a; }
  #game { position: fixed; display: block; touch-action: none; background: #3d3a33; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Teluk Senja: open-world crime game — explore the city on foot or by car, steal cars, escape the police and finish Raka's three missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
